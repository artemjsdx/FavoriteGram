name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [web-source]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then run this workflow again."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        if: steps.cloudflare.outputs.configured == 'true'
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend and Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: pnpm build

      - name: Ensure D1 database
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        run: |
          DB_ID="$(pnpm exec wrangler d1 list --json | node scripts/cloudflare-resource-id.mjs favouritegram-db)"
          if [[ -z "$DB_ID" ]]; then
            pnpm exec wrangler d1 create favouritegram-db
            DB_ID="$(pnpm exec wrangler d1 list --json | node scripts/cloudflare-resource-id.mjs favouritegram-db)"
          fi
          if [[ -z "$DB_ID" ]]; then
            echo "Could not resolve the D1 database ID" >&2
            exit 1
          fi
          node scripts/prepare-cloudflare-config.mjs "$DB_ID"

      - name: Apply D1 schema
        if: steps.cloudflare.outputs.configured == 'true'
        run: pnpm exec wrangler d1 execute favouritegram-db --remote --file=drizzle/0000_hosted_state.sql --config=.wrangler/deploy.jsonc

      - name: Deploy Worker
        if: steps.cloudflare.outputs.configured == 'true'
        run: pnpm exec wrangler deploy --config=.wrangler/deploy.jsonc
